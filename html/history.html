<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>History</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css" />
  <script src="../js/theme-toggle.js"></script>
</head>
<body>
  <nav class="topnav">
    <div class="nav-brand">Academic Performance Estimator</div>
    <div class="nav-links">
      <a href="index.html#hero">Home</a>
      <a href="index.html#how-it-works">How It Works</a>
      <a href="index.html#assessment">Assessment</a>
      <a href="history.html" class="active">History</a>
    </div>
    <div class="nav-actions">
      <label class="switch theme-toggle">
        <input id="checkbox" type="checkbox" />
        <span class="slider">
          <div class="star star_1"></div>
          <div class="star star_2"></div>
          <div class="star star_3"></div>
          <svg viewBox="0 0 16 16" class="cloud_1 cloud">
            <path transform="matrix(.77976 0 0 .78395-299.99-418.63)" fill="#fff"
              d="m391.84 540.91c-.421-.329-.949-.524-1.523-.524-1.351 0-2.451 1.084-2.485 2.435-1.395.526-2.388 1.88-2.388 3.466 0 1.874 1.385 3.423 3.182 3.667v.034h12.73v-.006c1.775-.104 3.182-1.584 3.182-3.395 0-1.747-1.309-3.186-2.994-3.379.007-.106.011-.214.011-.322 0-2.707-2.271-4.901-5.072-4.901-2.073 0-3.856 1.202-4.643 2.925">
            </path>
          </svg>
        </span>
      </label>
    </div>
  </nav>

  <div class="page">
    <header class="header">
      <div class="eyebrow">Your Records</div>
      <h1>History</h1>
    </header>

    <div id="history-empty" class="hidden">
      <p>No results yet. <a href="index.html#assessment">Take the assessment</a> to get started.</p>
    </div>

    <div id="history-content" class="hidden">
      <div class="field-row cols-2">
        <div class="field">
          <label class="field-label" for="year-level-filter">Year Level</label>
          <div class="input-shell">
            <select id="year-level-filter">
              <option value="">All</option>
              <option>1st Year</option><option>2nd Year</option>
              <option>3rd Year</option><option>4th Year</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="academic-term-filter">Academic Term</label>
          <div class="input-shell">
            <select id="academic-term-filter">
              <option value="">All</option>
              <option>1st Sem</option><option>2nd Sem</option><option>Midyear</option>
            </select>
          </div>
        </div>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Date</th><th>Year</th><th>Academic Term</th><th>Program</th>
            <th>Screen Time</th><th>Academic Phone Use</th><th>Social Phone Use</th>
            <th>Study Hrs/Day</th><th>Study Days/Wk</th>
            <th>GWA</th><th>Category</th>
          </tr>
        </thead>
        <tbody id="history-table-body"></tbody>
      </table>
      <button type="button" id="clear-btn" class="btn-secondary">Clear History</button>
    </div>
  </div>

  <script src="storage.js"></script>
  <script src="../js/history.js"></script>
  <script src="../js/chatbot-widget.js"></script>
</body>
</html>
